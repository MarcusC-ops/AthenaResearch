{% extends 'adminpanel/base_panel.html' %}
{% block content %}
<h1>Reject review</h1>
<p>{{ review.study.title }} · {{ review.rating }} / 5</p>
<form method="post">{% csrf_token %}
  {% include 'adminpanel/_form_field.html' with field=form.reason %}
  <button class="btn btn-primary rounded-pill" type="submit">Reject</button>
  <a class="btn btn-outline-dark rounded-pill" href="{% url 'adminpanel:reviews' %}">Cancel</a>
</form>
{% endblock %}
