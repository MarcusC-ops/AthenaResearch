{% extends 'base.html' %}

{% block body %}
  <header class="container py-3">
    <div class="d-flex justify-content-between align-items-center">
      <a href="{% url 'storefront:home' %}" class="wordmark text-decoration-none text-dark">Athena</a>
      <nav class="d-flex gap-3">
        <a href="{% url 'storefront:studies' %}" class="text-decoration-none text-primary">Studies</a>
        <a href="/accounts/login/" class="text-decoration-none text-primary">Sign in</a>
        <a href="/accounts/register/" class="text-decoration-none text-primary">Join Athena</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-5">
    <div class="wordmark display-6">Athena</div>
    <p class="mt-3 mb-2">Find research studies that fit your life</p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{% url 'storefront:studies' %}" class="text-decoration-none text-primary">Studies</a>
      <a href="{% url 'storefront:support' %}" class="text-decoration-none text-primary">FAQ</a>
      <a href="/accounts/register/?as=researcher" class="text-decoration-none text-primary">For research teams</a>
    </div>
  </footer>
{% endblock %}
